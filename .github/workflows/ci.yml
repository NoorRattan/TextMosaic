name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: grep -v '^torch==' backend/requirements-lock.txt > /tmp/requirements-without-torch.txt
      - run: python -m pip install --requirement /tmp/requirements-without-torch.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pip-audit --requirement backend/requirements-lock.txt
      - run: python -m pytest backend/tests -q
      - run: python -m compileall -q backend
      - run: docker build --file backend/Dockerfile --tag textmosaic-backend-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run build
      - run: docker build --file Dockerfile --tag textmosaic-frontend-ci .
