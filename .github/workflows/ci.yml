name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: grep -v '^torch==' backend/requirements-lock.txt > /tmp/requirements-without-torch.txt
      - run: python -m pip install --requirement /tmp/requirements-without-torch.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pip-audit --requirement backend/requirements-lock.txt
      - run: python -m pytest backend/tests -q
      - run: python -m compileall -q backend
      - run: docker build --file backend/Dockerfile --tag textmosaic-backend-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run build
      - run: npm run build:pages
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --file Dockerfile --tag textmosaic-frontend-ci .

  huggingface-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - run: docker build --tag textmosaic-hf-space-ci .
      - run: docker run --detach --name textmosaic-hf-space-ci --publish 7860:7860 --env ALLOWED_HOSTS=localhost,127.0.0.1 textmosaic-hf-space-ci
      - run: for attempt in $(seq 1 30); do curl --fail --silent http://localhost:7860/health && exit 0; sleep 2; done; docker logs textmosaic-hf-space-ci; exit 1
      - run: curl --fail --silent http://localhost:7860/api/tiers
      - run: curl --fail --silent http://localhost:7860/ | grep --fixed-strings '<div id="root"></div>'
