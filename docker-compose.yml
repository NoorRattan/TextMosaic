services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_HOSTS: localhost,127.0.0.1
      PORT: "7860"
    ports:
      - "7860:7860"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:7860
    depends_on:
      - backend
    ports:
      - "5173:8080"
